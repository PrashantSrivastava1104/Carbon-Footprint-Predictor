services:
  - type: web
    name: carbon-footprint-predictor
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python src/train.py
    startCommand: gunicorn app:app --workers 1 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "0"
      - key: PORT
        value: "10000"
